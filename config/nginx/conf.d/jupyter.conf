# Reverse proxy to JupyterLab, including websocket support (needed for
# kernels/terminals). Extend this container by adding more location blocks
# here, or drop additional *.conf files next to this one — they're all
# included automatically, and `restart.sh nginx` reloads them live.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Written by scripts/lib.sh (configure_basic_auth) from BASIC_AUTH_USER /
    # BASIC_AUTH_PASSWORD — empty unless BASIC_AUTH_PASSWORD is set.
    include /workspace/config/nginx/auth.conf;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket upgrade for Jupyter kernels/terminals
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
