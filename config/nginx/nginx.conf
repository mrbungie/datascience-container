worker_processes auto;
pid /workspace/run/nginx.pid;
error_log /workspace/logs/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /workspace/logs/nginx-access.log;
    sendfile      on;
    keepalive_timeout 65;

    # Drop any extra site/service definitions here — files are picked up on
    # `restart.sh nginx` without touching Jupyter or the rest of the container.
    include /workspace/config/nginx/conf.d/*.conf;
}
